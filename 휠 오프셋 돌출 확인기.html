<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>휠 오프셋 돌출 확인기</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--tx:#1c1c1a;--mu:#6b6b66;--ac:#c2410c;--bd:#e2e2dc;--ok:#15803d;--warn:#b45309;--old:#8a8a84;--fen:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#222220;--tx:#f0f0ec;--mu:#9a9a94;--ac:#fb923c;--bd:#38382f;--ok:#4ade80;--warn:#fbbf24;--old:#a8a8a0;--fen:#60a5fa}}
:root[data-theme="dark"]{--bg:#161615;--card:#222220;--tx:#f0f0ec;--mu:#9a9a94;--ac:#fb923c;--bd:#38382f;--ok:#4ade80;--warn:#fbbf24;--old:#a8a8a0;--fen:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:16px;max-width:520px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 2px}
p.s{color:var(--mu);font-size:13px;margin:0 0 12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:12px}
.card h2{font-size:13px;margin:0 0 6px;font-weight:700}
.o h2{color:var(--old)}.n h2{color:var(--ac)}
label{display:block;font-size:11px;color:var(--mu);margin:8px 0 3px}
input{width:100%;font-size:18px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input:focus{outline:2px solid var(--ac)}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row:last-child{border:0}.row span:first-child{color:var(--mu)}
svg{width:100%;height:auto;display:block}
.ok{color:var(--ok)}.warn{color:var(--warn)}
.note{font-size:11px;color:var(--mu);margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<h1>휠 오프셋 돌출 확인기</h1>
<p class="s">순정 휠과 튜닝 휠의 림폭(J), 오프셋(ET)을 넣으면 단면 도면과 돌출량이 나와요.</p>

<div class="g">
  <div class="card o" style="margin-top:0"><h2>순정 휠</h2>
    <label for="j1">림폭 J (인치)</label><input id="j1" type="number" inputmode="decimal" step="0.5" value="7.5">
    <label for="e1">오프셋 ET (mm)</label><input id="e1" type="number" inputmode="decimal" step="1" value="44">
  </div>
  <div class="card n" style="margin-top:0"><h2>튜닝 휠</h2>
    <label for="j2">림폭 J (인치)</label><input id="j2" type="number" inputmode="decimal" step="0.5" value="9">
    <label for="e2">오프셋 ET (mm)</label><input id="e2" type="number" inputmode="decimal" step="1" value="0">
  </div>
</div>
<label for="fz">순정 휠 바깥면에서 펜더까지 여유 (mm, 선택)</label>
<input id="fz" type="number" inputmode="decimal" step="1" placeholder="예: 15">

<div class="card"><h2>단면 도면 (위에서 본 모습, 오른쪽이 차량 바깥)</h2><div id="d"></div></div>
<div class="card" id="r"></div>
<p class="note">허브 장착면(0점)을 기준으로 계산한 값이에요. 타이어 폭은 반영하지 않았어요. 실제로는 타이어 옆면이 휠보다 더 나올 수 있고, 안쪽은 캘리퍼와 서스펜션 간섭도 확인해야 해요. 펜더 밖으로 나오는 튜닝은 승인 대상일 수 있어요.</p>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const v=parseFloat($(id).value);return isNaN(v)?null:v};
const sg=v=>(v>=0?'+':'')+v.toFixed(1);
function geo(j,et){const w=j*25.4;return{out:w/2-et,inn:-(w/2+et),w}}
function draw(a,b,fz){
  const xs=[a.inn,a.out,b.inn,b.out];if(fz!=null)xs.push(a.out+fz);
  const mn=Math.min(...xs,0)-25,mx=Math.max(...xs,0)+25,W=mx-mn,H=150,vb=`${mn} 0 ${W} ${H}`;
  const t=(x,y,s,c,anc)=>`<text x="${x}" y="${y}" font-size="${W/22}" fill="${c}" text-anchor="${anc||'middle'}">${s}</text>`;
  let s=`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<rect x="${a.inn}" y="35" width="${a.w}" height="80" rx="3" fill="none" stroke="var(--old)" stroke-width="${W/200}" stroke-dasharray="${W/60}"/>`;
  s+=`<rect x="${b.inn}" y="45" width="${b.w}" height="60" rx="3" fill="var(--ac)" fill-opacity=".25" stroke="var(--ac)" stroke-width="${W/150}"/>`;
  s+=`<line x1="0" y1="15" x2="0" y2="135" stroke="var(--tx)" stroke-width="${W/160}"/>`;
  s+=t(0,11,'허브면','var(--tx)');
  if(fz!=null){const fx=a.out+fz;s+=`<line x1="${fx}" y1="20" x2="${fx}" y2="130" stroke="var(--fen)" stroke-width="${W/120}" stroke-dasharray="${W/50}"/>`+t(fx,146,'펜더','var(--fen)')}
  s+=t(a.inn,30,'순정','var(--old)','start')+t(b.out,125+10,'튜닝','var(--ac)','end');
  return s+'</svg>';
}
function row(k,v){return`<div class="row"><span>${k}</span><span>${v}</span></div>`}
function calc(){
  const j1=num('j1'),e1=num('e1'),j2=num('j2'),e2=num('e2'),fz=num('fz');
  if([j1,e1,j2,e2].some(v=>v===null)){$('r').innerHTML='<span class="warn">값을 모두 입력해 주세요.</span>';$('d').innerHTML='';return}
  const a=geo(j1,e1),b=geo(j2,e2);
  const outD=b.out-a.out,innD=a.inn-b.inn;
  const bsA=-a.inn,bsB=-b.inn;
  let h=row('바깥면 돌출 변화',`<b class="${outD>0?'warn':'ok'}">${sg(outD)}mm ${outD>0?'(더 나옴)':'(들어감)'}</b>`)+
    row('안쪽면 이동',`<b>${sg(-innD)}mm ${innD>0?'(서스펜션에서 멀어짐)':'(서스펜션 쪽으로 가까워짐)'}</b>`)+
    row('백스페이싱',`${bsA.toFixed(1)} → ${bsB.toFixed(1)}mm`)+
    row('림폭 차이',`${sg((j2-j1)*25.4)}mm (${sg(j2-j1)}in)`);
  if(fz!=null){const over=outD-fz;h+=row('펜더 판정',over>0?`<b class="warn">펜더 밖으로 ${over.toFixed(1)}mm 돌출</b>`:`<b class="ok">펜더 안쪽 (여유 ${(-over).toFixed(1)}mm)</b>`)}
  $('r').innerHTML=h;$('d').innerHTML=draw(a,b,fz);
}
['j1','e1','j2','e2','fz'].forEach(id=>$(id).addEventListener('input',calc));calc();
</script>
</body>
</html>
